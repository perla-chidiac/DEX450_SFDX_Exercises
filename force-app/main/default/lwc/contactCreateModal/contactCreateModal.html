<template>
    <lightning-modal-header title="Add New Contact"></lightning-modal-header>
    <lightning-modal-body>
        <lightning-record-edit-form 
            object-api-name="Contact" 
            onsuccess={handleSuccess}
            onerror={handleError}>
            
            <lightning-input-field field-name="AccountId" value={accountId} class="slds-hide"></lightning-input-field>
            
            <lightning-input-field field-name="FirstName"></lightning-input-field>
            <lightning-input-field field-name="LastName" required></lightning-input-field>
            <lightning-input-field field-name="Email"></lightning-input-field>
            <lightning-input-field field-name="Phone"></lightning-input-field>
            <lightning-input-field field-name="Title"></lightning-input-field>

            <div class="slds-m-top_medium slds-float_right">
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
                <lightning-button type="submit" variant="brand" label="Save Contact"></lightning-button>
            </div>
        </lightning-record-edit-form>
    </lightning-modal-body>
</template>
